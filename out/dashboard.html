<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>EarthMimic</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Layout: a control band, then one wide equal-area map with two polar insets,
   then the ranked sites beside a target-versus-site comparison. */
:root {
  --bg: #ECEEF1; --surface: #F8F9FA; --ink: #18202B; --muted: #566270; --line: #C9CFD6; --track: #D2D8DF;
  --ocean: #F8FAFB; --land: #E6EAEE; --grat: rgba(24, 32, 43, .08);
  --moon: #2F5D8A; --mars: #A9471F; --ok: #2A684B; --warn: #7D5F0C; --bad: #9B2F2F;
  /* Match-score ramps, weakest to strongest. One hue per world. */
  --moon1: #89A6C4; --moon2: #6C92B8; --moon3: #4F7CA8; --moon4: #336495; --moon5: #173F6B;
  --mars1: #CF967A; --mars2: #C27B56; --mars3: #B06138; --mars4: #954820; --mars5: #6E2C0D;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --text: Barlow, "Segoe UI", system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #10151B; --surface: #19212A; --ink: #E4E8EC; --muted: #9AA6B2; --line: #2E3945; --track: #33404E;
    --ocean: #141B23; --land: #232D39; --grat: rgba(228, 232, 236, .07);
    --moon: #7FA9D6; --mars: #E08A5C; --ok: #6FBF98; --warn: #D9B44A; --bad: #E58585;
    --moon1: #4E7299; --moon2: #6189B5; --moon3: #7BA3CF; --moon4: #9DC0E6; --moon5: #C6DEF8;
    --mars1: #96512F; --mars2: #B4683F; --mars3: #CF8254; --mars4: #E6A078; --mars5: #F8C8AC;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #10151B; --surface: #19212A; --ink: #E4E8EC; --muted: #9AA6B2; --line: #2E3945; --track: #33404E;
  --ocean: #141B23; --land: #232D39; --grat: rgba(228, 232, 236, .07);
  --moon: #7FA9D6; --mars: #E08A5C; --ok: #6FBF98; --warn: #D9B44A; --bad: #E58585;
  --moon1: #4E7299; --moon2: #6189B5; --moon3: #7BA3CF; --moon4: #9DC0E6; --moon5: #C6DEF8;
  --mars1: #96512F; --mars2: #B4683F; --mars3: #CF8254; --mars4: #E6A078; --mars5: #F8C8AC;
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.5 var(--text); }
#app { --accent: var(--moon); --r1: var(--moon1); --r2: var(--moon2); --r3: var(--moon3); --r4: var(--moon4); --r5: var(--moon5); }
#app[data-body="Mars"] { --accent: var(--mars); --r1: var(--mars1); --r2: var(--mars2); --r3: var(--mars3); --r4: var(--mars4); --r5: var(--mars5); }
.wrap { max-width: 74rem; margin: 0 auto; padding-block: 1.25rem 3rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: 2.4rem; letter-spacing: -0.01em; }
h2 { font-size: 1.75rem; margin-bottom: .35rem; }
h3 { font-size: 1.2rem; margin: 1.5rem 0 .5rem; }
p { margin: 0 0 .75rem; max-width: 68ch; }
a { color: inherit; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.eyebrow { font-size: .8rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 .15rem; }
header p { margin: .2rem 0 0; color: var(--muted); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.themebtn { flex: none; padding: .35rem .75rem; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; cursor: pointer; font-size: .9rem; }
.campmap { display: block; width: 100%; height: 42rem; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); }
.notice { margin: .9rem 0 0; padding: .55rem .8rem; border-left: 4px solid var(--warn); background: var(--surface); font-size: .9rem; max-width: none; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- controls */
.controls { margin-top: 1.25rem; display: grid; gap: 1rem 2rem; }
@media (min-width: 60rem) { .controls { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); align-items: start; } }
.field > span, .field label > span { display: block; font-weight: 600; margin-bottom: .35rem; }
.targets { display: grid; gap: .4rem; grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr)); }
.targets button { text-align: left; padding: .45rem .65rem; background: var(--surface); border: 1px solid var(--line);
  border-left: 4px solid var(--moon); border-radius: 3px; cursor: pointer; line-height: 1.25; }
.targets button[data-b="Mars"] { border-left-color: var(--mars); }
.targets button small { display: block; color: var(--muted); }
.targets button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.targets button[aria-pressed="true"] small { color: inherit; opacity: .75; }
select { width: 100%; padding: .5rem; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; }
details.weights { margin-top: .5rem; }
details.weights summary { cursor: pointer; color: var(--muted); }
.sliders { display: grid; gap: .3rem; margin-top: .6rem; }
.sliders label { display: grid; grid-template-columns: minmax(0, 1fr) 6.5rem 2rem; align-items: center; gap: .5rem; font-size: .9rem; }
.sliders input { width: 100%; accent-color: var(--accent); }
.sliders output { text-align: right; font-variant-numeric: tabular-nums; }

nav { display: flex; gap: 1.4rem; margin: 1.5rem 0 1.25rem; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav a { padding: .5rem 0; color: var(--muted); text-decoration: none; font-weight: 500; white-space: nowrap; border-bottom: 3px solid transparent; }
nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

/* ---- analogs: heading, facts, maps */
.thead { display: grid; gap: 1rem 2.5rem; margin-bottom: 1rem; }
@media (min-width: 60rem) { .thead { grid-template-columns: minmax(0, 1fr) auto; align-items: end; } }
.thead p { margin-bottom: 0; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .75rem 1.25rem; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font: 600 1.7rem/1 var(--display); }
.facts dd { margin: .2rem 0 0; font-size: .8rem; color: var(--muted); line-height: 1.3; }
@media (min-width: 60rem) { .facts { grid-template-columns: repeat(3, minmax(0, 12.5rem)); gap: .75rem 2.25rem; } .facts dt { font-size: 2rem; } .facts dd { font-size: .875rem; } }
.maps { display: grid; gap: 1rem; }
@media (min-width: 60rem) { .maps { grid-template-columns: minmax(0, 1fr) 12.5rem; align-items: center; } }
.mapbox { min-width: 0; }
.poles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
@media (min-width: 60rem) { .poles { grid-template-columns: minmax(0, 1fr); } }
figure { margin: 0; min-width: 0; }
figcaption { font-size: .8rem; color: var(--muted); text-align: center; margin-top: .1rem; }
.polebox { width: 100%; max-width: 13rem; margin-inline: auto; aspect-ratio: 1; }
svg.mapsvg { display: block; max-width: 100%; height: auto; overflow: visible; }
.mapsvg .ocean { fill: var(--ocean); stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.mapsvg .land { fill: var(--land); }
.mapsvg .grat { fill: none; stroke: var(--grat); stroke-width: 1; vector-effect: non-scaling-stroke; }
.mapsvg .cell { cursor: pointer; }
.c0 { fill: var(--r1); } .c1 { fill: var(--r2); } .c2 { fill: var(--r3); } .c3 { fill: var(--r4); } .c4 { fill: var(--r5); }
.mapsvg .top { fill: var(--r5); stroke: var(--ocean); stroke-width: 2; cursor: pointer; }
.mapsvg .known { fill: none; stroke: var(--ink); stroke-width: 1.5; cursor: pointer; pointer-events: all; }
.mapsvg .selring { fill: none; stroke: var(--ink); stroke-width: 2; }
.mapsvg .sellab { font: 600 12px var(--text); fill: var(--ink); stroke: var(--ocean); stroke-width: 3; paint-order: stroke; pointer-events: none; }
.mapsvg .lonlab { font: 500 10px var(--text); fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1.5rem; margin: .6rem 0 0; font-size: .875rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: .4rem; }
.legend svg { width: 1rem; height: 1rem; flex: none; }
.scale { display: inline-flex; gap: 2px; }
.scale i { width: 1.4rem; height: .7rem; }
.scale i:first-child { border-radius: 2px 0 0 2px; } .scale i:last-child { border-radius: 0 2px 2px 0; }
.scale .c0 { background: var(--r1); } .scale .c1 { background: var(--r2); } .scale .c2 { background: var(--r3); } .scale .c3 { background: var(--r4); } .scale .c4 { background: var(--r5); }
#tip { position: fixed; z-index: 20; pointer-events: none; max-width: 16rem; padding: .4rem .6rem; background: var(--ink); color: var(--bg);
  border-radius: 3px; font-size: .85rem; line-height: 1.35; }
#tip b { display: block; font-weight: 600; }

/* ---- analogs: ranked list beside the comparison panel */
.duo { display: grid; gap: 1.5rem; margin-top: 1.75rem; }
@media (min-width: 60rem) { .duo { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); align-items: start; }
  .duo .panel { grid-column: 2; grid-row: 1 / span 2; } .duo .cannot { grid-column: 1; grid-row: 2; } }
.cannot .prop { grid-template-columns: minmax(0, 1fr) 2.6rem; grid-template-areas: "label sim" "strip strip" "cap cap"; }
.duo > * { min-width: 0; }
ol.rank { list-style: none; padding: 0; margin: 0; }
ol.rank > li { border-top: 1px solid var(--line); }
ol.rank > li:last-child { border-bottom: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; gap: .1rem .5rem; width: 100%; padding: .55rem .4rem;
  background: none; border: 0; text-align: left; cursor: pointer; align-items: baseline; }
.row[aria-pressed="true"] { background: var(--surface); box-shadow: inset 4px 0 0 var(--accent); }
.row .n { font: 600 1.25rem var(--display); color: var(--muted); }
.row .score { font: 600 1.25rem var(--display); font-variant-numeric: tabular-nums; }
.row .name { font-weight: 600; }
.row .sub { display: block; color: var(--muted); font-size: .875rem; }
.row .sbar { grid-column: 2 / 4; height: 4px; background: var(--track); border-radius: 2px; overflow: hidden; margin-top: .25rem; }
.row .sbar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.tag { display: inline-block; font-size: .8rem; padding: 0 .4rem; border: 1px solid currentColor; border-radius: 2px; }
.tag.new { color: var(--accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 1rem 1.1rem 1.2rem; scroll-margin-top: .5rem; }
.vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: .75rem; align-items: center; }
.vs .side strong { display: block; font: 600 1.25rem/1.15 var(--display); }
.vs .side:last-child { text-align: right; }
.vs .mid { text-align: center; padding: 0 .25rem; }
@media (max-width: 34rem) { .vs { grid-template-columns: repeat(2, minmax(0, 1fr)); } .vs .mid { grid-column: 1 / 3; grid-row: 1; } }
.vs .big { display: block; font: 600 2.6rem/1 var(--display); }
.sub { color: var(--muted); font-size: .875rem; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(4rem, 9rem) 2.6rem; gap: .5rem; align-items: center; font-size: .875rem; padding: .12rem 0; }
.bar .track, .inbar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
.bar .track i, .inbar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bar .v { text-align: right; font-variant-numeric: tabular-nums; }
.key { display: flex; flex-wrap: wrap; gap: .25rem 1.1rem; margin: 0 0 .6rem; font-size: .8rem; color: var(--muted); }
.key span { display: inline-flex; align-items: center; gap: .35rem; }
.key i { display: inline-block; flex: none; }
.key .k-tgt { width: 2px; height: 14px; background: var(--ink); }
.key .k-here { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.key .k-earth { width: 18px; height: 6px; border-radius: 3px; background: var(--track); }
.key .k-band { width: 18px; height: 10px; border-radius: 2px; background: color-mix(in srgb, var(--accent) 30%, transparent); }
.key .k-off { width: 0; height: 0; border: 5px solid transparent; border-left-color: var(--bad); margin-right: -5px; }
.dimhead { display: flex; justify-content: space-between; gap: 1rem; margin: 1rem 0 .15rem; padding-bottom: .15rem; border-bottom: 1px solid var(--line);
  font-size: .8rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.prop { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr) 2.6rem; grid-template-areas: "label strip sim" ". cap cap";
  gap: 0 .75rem; align-items: center; padding: .3rem 0; font-size: .9rem; }
@media (max-width: 34rem) { .prop { grid-template-columns: minmax(0, 1fr) 2.6rem; grid-template-areas: "label sim" "strip strip" "cap cap"; } }
.prop .label { grid-area: label; }
.prop .sim { grid-area: sim; text-align: right; font-variant-numeric: tabular-nums; }
.prop .cap { grid-area: cap; font-size: .8rem; color: var(--muted); }
.strip { grid-area: strip; display: block; position: relative; height: 22px; }
.strip::before { content: ""; position: absolute; left: 0; right: 0; top: 10.5px; height: 1px; background: var(--line); }
.strip i { position: absolute; display: block; }
.strip .earth { top: 8px; height: 6px; border-radius: 3px; background: var(--track); }
.strip .band { top: 5px; height: 12px; border-radius: 2px; background: color-mix(in srgb, var(--accent) 30%, transparent); }
.strip .tgt { top: 1px; width: 2px; height: 20px; background: var(--ink); transform: translateX(-1px); }
.strip .tgt.off-lo, .strip .tgt.off-hi { top: 5px; width: 0; height: 0; background: none; border: 6px solid transparent; transform: translateX(-6px); }
.strip .tgt.off-lo { border-right-color: var(--bad); }
.strip .tgt.off-hi { border-left-color: var(--bad); }
.strip .here { top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); transform: translateX(-6px); }

/* ---- status glyphs, matrix, tables */
.g { width: .95rem; height: .95rem; vertical-align: -.15rem; flex: none; }
.g-match { color: var(--ok); } .g-partial { color: var(--warn); } .g-breaks_down { color: var(--bad); } .g-not_tested { color: var(--muted); }
.glyphs { display: inline-flex; flex-wrap: wrap; gap: 2px; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
.scroll { overflow-x: auto; }
th, td { text-align: left; padding: .4rem .6rem .4rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
thead th { font-size: .8rem; font-weight: 600; color: var(--muted); vertical-align: bottom; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.matrix td, .matrix th { vertical-align: middle; }
.matrix tbody th { font-weight: 400; padding-left: .5rem; }
.matrix tbody th button { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font-weight: 600; line-height: 1.25; }
.matrix tbody th small { display: block; font-weight: 400; color: var(--muted); }
.matrix tr.cur th, .matrix tr.cur td { background: var(--surface); }
.matrix tr.cur th { box-shadow: inset 4px 0 0 var(--accent); }
.matrix .cov { min-width: 8rem; white-space: nowrap; }
.cov .inbar, td .inbar { display: inline-block; width: 5rem; vertical-align: middle; margin-right: .4rem; }
.status { list-style: none; padding: 0; margin: 0; max-width: 54rem; }
.status > li { padding: .5rem 0 .6rem; border-top: 1px solid var(--line); }
.status li strong { display: inline; }
.status .why { display: block; font-size: .875rem; max-width: 68ch; }
.status .prop { padding-bottom: 0; }
details.card { border-top: 1px solid var(--line); }
details.card summary { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .5rem; padding: .6rem 0; cursor: pointer; align-items: baseline; }
details.card summary small { display: block; color: var(--muted); }
.verdict { font-weight: 600; white-space: nowrap; }
.verdict.accepted { color: var(--ok); } .verdict.denied { color: var(--bad); } .verdict.pending { color: var(--warn); }
.seg { display: flex; gap: 2px; height: 12px; margin: .6rem 0 .4rem; max-width: 40rem; }
.seg i { display: block; border-radius: 3px; min-width: 3px; }
.seg .accepted, .sw.accepted { background: var(--ok); } .seg .pending, .sw.pending { background: var(--warn); } .seg .denied, .sw.denied { background: var(--bad); }
.sw { display: inline-block; width: .7rem; height: .7rem; border-radius: 2px; }
.runs { display: grid; gap: .5rem 1.5rem; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); margin: .75rem 0 1rem; }
.runs .inbar { margin-top: .2rem; }
code { font-size: .85em; word-break: break-all; }
.checks { list-style: none; padding: 0 0 .8rem; margin: 0; font-size: .9rem; }
.checks li { display: grid; grid-template-columns: 4.2rem minmax(0, 1fr); gap: .5rem; padding: .2rem 0; }
.checks .pass { color: var(--ok); } .checks .warn { color: var(--warn); } .checks .fail { color: var(--bad); }
.log { font-size: .875rem; color: var(--muted); padding-left: 1.2rem; }
@media (prefers-reduced-motion: no-preference) { .row .sbar i, .bar .track i { transition: width .25s ease; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="g-match" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.6" fill="currentColor"/></symbol>
  <symbol id="g-partial" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 2a4 4 0 0 0 0 8z" fill="currentColor"/></symbol>
  <symbol id="g-breaks_down" viewBox="0 0 12 12"><path d="M2.6 2.6l6.8 6.8M9.4 2.6l-6.8 6.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
  <symbol id="g-not_tested" viewBox="0 0 12 12"><circle cx="6" cy="6" r="3.4" fill="none" stroke="currentColor" stroke-width="1.2"/></symbol>
</defs></svg>
<div class="wrap" id="app">
  <header>
    <div class="top"><h1>EarthMimic</h1><button type="button" id="theme" class="themebtn">Dark mode</button></div>
    <p>Where on Earth to rehearse a Moon or Mars mission, and where the comparison stops working.</p>
    <div id="notice"></div>
  </header>

  <section class="controls" aria-label="Choose a target and a mission">
    <div class="field"><span id="tl">Target site</span><div class="targets" id="targets" role="group" aria-labelledby="tl"></div></div>
    <div class="field">
      <label><span>Mission</span><select id="preset"></select></label>
      <p class="muted small" id="presetAbout" style="margin:.35rem 0 0"></p>
      <details class="weights"><summary>Adjust the weights</summary><div class="sliders" id="sliders"></div></details>
      <label style="display:block;margin-top:.8rem"><span>Rank by</span><select id="focus"></select></label>
    </div>
  </section>

  <nav aria-label="Views">
    <a href="#analogs">Analogs</a><a href="#limits">Limits</a><a href="#plan">Test plan</a><a href="#validation">Validation</a><a href="#agent">Agent</a><a href="#data">Data</a>
  </nav>
  <main id="view"></main>
</div>
<div id="tip" role="status" hidden></div>

<script>// EarthMimic scoring, mirrored from earthmimic/matching.py and
// earthmimic/sensitivity.py so the dashboard can re-score live when the
// weights change. tests/test_earthmimic.py checks both give the same scores.
var EM = (function () {
  "use strict";

  // Pairings of this target that enter the score (match or partial).
  function usedPairs(target) {
    return target.profile.filter(function (p) { return p.factor > 0; });
  }

  // One Float64Array of similarities per used pairing; NaN where Earth has no value.
  function similarities(earthCols, used) {
    return used.map(function (p) {
      var x = earthCols[p.earth_col], out = new Float64Array(x.length);
      for (var i = 0; i < x.length; i++) {
        if (x[i] === null) { out[i] = NaN; continue; }
        var z;
        if (p.scale === "log") {
          if (!(x[i] > 0)) { out[i] = NaN; continue; }
          z = (Math.log10(x[i]) - Math.log10(p.target_value)) / p.bandwidth;
        } else z = (x[i] - p.target_value) / p.bandwidth;
        out[i] = Math.exp(-0.5 * z * z);
      }
      return out;
    });
  }

  // Normalised weight of each used pairing. `scale` optionally jitters confidences.

  // ------------------------------------------------- field campaign routing
  var campState = { start: undefined };   // undefined until first drawn: then the pipeline's start point, if any

  function haverKm(la1, lo1, la2, lo2) {
    var r = Math.PI / 180, a = Math.sin((la2 - la1) * r / 2), b = Math.sin((lo2 - lo1) * r / 2);
    return 2 * 6371 * Math.asin(Math.sqrt(a * a + Math.cos(la1 * r) * Math.cos(la2 * r) * b * b));
  }

  function campaignCurve(start) {
    var R = live.t.plan.requirements, rows = [];
    if (!R.length) return rows;
    var pass = [], i, j, m;
    for (i = 0; i < N; i++) {
      m = 0;
      for (j = 0; j < R.length; j++) {
        var v = D.earth.cols[R[j].earth_col] ? D.earth.cols[R[j].earth_col][i] : null;
        if (v != null && v >= R[j].lo && v <= R[j].hi) m |= 1 << j;
      }
      pass.push(m);
    }
    var rep = {};
    for (i = 0; i < N; i++) {
      m = pass[i];
      if (!m) continue;
      if (!(m in rep)) rep[m] = i;
      else if (start && haverKm(start[0], start[1], D.earth.lat[i], D.earth.lon[i]) <
                        haverKm(start[0], start[1], D.earth.lat[rep[m]], D.earth.lon[rep[m]])) rep[m] = i;
    }
    var masks = Object.keys(rep).map(Number), goal = 0;
    masks.forEach(function (x) { goal |= x; });
    var pop = function (x) { var c = 0; while (x) { c += x & 1; x >>= 1; } return c; };
    var routeKm = function (order) {
      var km = 0, prev = start;
      order.forEach(function (ix) { if (prev) km += haverKm(prev[0], prev[1], D.earth.lat[ix], D.earth.lon[ix]); prev = [D.earth.lat[ix], D.earth.lon[ix]]; });
      return km;
    };
    var bestOrder = function (idx) {   // all permutations of up to 5 stops
      var best = idx.slice(), bk = Infinity;
      var perm = function (cur, rest) {
        if (!rest.length) { var km = routeKm(cur); if (km < bk) { bk = km; best = cur.slice(); } return; }
        for (var q = 0; q < rest.length; q++) perm(cur.concat([rest[q]]), rest.slice(0, q).concat(rest.slice(q + 1)));
      };
      perm([], idx);
      return { order: best, km: bk };
    };
    var maxCover = pop(goal);
    for (var k = 1; k <= Math.min(5, masks.length); k++) {
      var combos = [], pick = function (startAt, cur) {
        if (cur.length === k) { combos.push(cur.slice()); return; }
        for (var q = startAt; q < masks.length; q++) { cur.push(q); pick(q + 1, cur); cur.pop(); if (combos.length > 200000) return; }
      };
      pick(0, []);
      var bestCov = 0;
      combos.forEach(function (c) { var u = 0; c.forEach(function (q) { u |= masks[q]; }); if (pop(u) > bestCov) bestCov = pop(u); });
      var best = null, tried = 0;
      combos.forEach(function (c) {
        var u = 0;
        c.forEach(function (q) { u |= masks[q]; });
        if (pop(u) !== bestCov || tried > 3000) return;
        tried++;
        var r = bestOrder(c.map(function (q) { return rep[masks[q]]; }));
        if (!best || r.km < best.km) best = { covered: bestCov, km: r.km, order: r.order, union: u };
      });
      if (!best) break;
      rows.push({ k: best.order.length, covered: best.covered, km: best.km, union: best.union,
                  stops: best.order.map(function (ix) { return { index: ix, lat: D.earth.lat[ix], lon: D.earth.lon[ix] }; }) });
      if (best.covered >= maxCover) break;
    }
    return rows;
  }

    state.selected = null; compute();
    document.getElementById("preset").value = state.preset;
    document.getElementById("presetAbout").textContent = any ? "Using the weights you set below." : "All weights were zero, so the balanced mission was restored.";
    if (!any) drawControls();
    draw();
  });
  var view = document.getElementById("view"), tip = document.getElementById("tip");
  view.addEventListener("click", function (e) {
    var tb = e.target.closest("[data-t]");
    if (tb) { pickTarget(tb.getAttribute("data-t")); return; }
    var el = e.target.closest("[data-i]"); if (!el) return;
    state.selected = parseInt(el.getAttribute("data-i"), 10); draw();
    if (el.hasAttribute("data-row") && window.matchMedia("(max-width: 59.99rem)").matches) {
      var calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      document.getElementById("panel").scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "start" });
    }
  });
  function showTip(e) {
    var el = e.target.closest ? e.target.closest(".mapsvg [data-i]") : null;
    if (!el) { tip.hidden = true; return; }
    var i = parseInt(el.getAttribute("data-i"), 10);
    tip.innerHTML = "<b>" + esc(cellName(i)) + "</b>" + coords(i) + "<br>Score " + (has(i) ? live.total[i].toFixed(2) : "n/a") + ", rank " + live.rank[i] + " of " + N +
      (D.earth.known[i] ? "<br>Known analog" : isNew(i) && live.rank[i] <= P.top_k ? "<br>Unrecognized candidate" : "");
    tip.hidden = false;
    var w = tip.offsetWidth, hgt = tip.offsetHeight;
    tip.style.left = Math.max(4, Math.min(window.innerWidth - w - 4, e.clientX + 14)) + "px";
    tip.style.top = (e.clientY + 18 + hgt > window.innerHeight ? e.clientY - hgt - 10 : e.clientY + 18) + "px";
  }
  view.addEventListener("pointermove", showTip);
  view.addEventListener("pointerleave", function () { tip.hidden = true; });
  window.addEventListener("scroll", function () { tip.hidden = true; }, { passive: true });
  var resizeTimer = null;
  window.addEventListener("resize", function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(function () { if (tab() === "analogs") paintMaps(); }, 150); });
  window.addEventListener("hashchange", draw);

  // Light/dark switch. With no choice made, the page follows the device or app theme.
  var root = document.documentElement, themeBtn = document.getElementById("theme");
  function isDark() {
    var t = root.getAttribute("data-theme");
    return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function labelTheme() { themeBtn.textContent = isDark() ? "Light mode" : "Dark mode"; }
  try { var saved = localStorage.getItem("earthmimic-theme"); if (saved === "dark" || saved === "light") root.setAttribute("data-theme", saved); } catch (e) {}
  themeBtn.addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("earthmimic-theme", next); } catch (e) {}
    labelTheme();
  });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", labelTheme);
  labelTheme();
  refresh(true);
})();
</script>
</body>
</html>
