<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>EarthMimic</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Layout: a control band, then one wide equal-area map with two polar insets,
   then the ranked sites beside a target-versus-site comparison. */
:root {
  --bg: #ECEEF1; --surface: #F8F9FA; --ink: #18202B; --muted: #566270; --line: #C9CFD6; --track: #D2D8DF;
  --ocean: #F8FAFB; --land: #E6EAEE; --grat: rgba(24, 32, 43, .08);
  --moon: #2F5D8A; --mars: #A9471F; --ok: #2A684B; --warn: #7D5F0C; --bad: #9B2F2F;
  /* Match-score ramps, weakest to strongest. One hue per world. */
  --moon1: #89A6C4; --moon2: #6C92B8; --moon3: #4F7CA8; --moon4: #336495; --moon5: #173F6B;
  --mars1: #CF967A; --mars2: #C27B56; --mars3: #B06138; --mars4: #954820; --mars5: #6E2C0D;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --text: Barlow, "Segoe UI", system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #10151B; --surface: #19212A; --ink: #E4E8EC; --muted: #9AA6B2; --line: #2E3945; --track: #33404E;
    --ocean: #141B23; --land: #232D39; --grat: rgba(228, 232, 236, .07);
    --moon: #7FA9D6; --mars: #E08A5C; --ok: #6FBF98; --warn: #D9B44A; --bad: #E58585;
    --moon1: #4E7299; --moon2: #6189B5; --moon3: #7BA3CF; --moon4: #9DC0E6; --moon5: #C6DEF8;
    --mars1: #96512F; --mars2: #B4683F; --mars3: #CF8254; --mars4: #E6A078; --mars5: #F8C8AC;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #10151B; --surface: #19212A; --ink: #E4E8EC; --muted: #9AA6B2; --line: #2E3945; --track: #33404E;
  --ocean: #141B23; --land: #232D39; --grat: rgba(228, 232, 236, .07);
  --moon: #7FA9D6; --mars: #E08A5C; --ok: #6FBF98; --warn: #D9B44A; --bad: #E58585;
  --moon1: #4E7299; --moon2: #6189B5; --moon3: #7BA3CF; --moon4: #9DC0E6; --moon5: #C6DEF8;
  --mars1: #96512F; --mars2: #B4683F; --mars3: #CF8254; --mars4: #E6A078; --mars5: #F8C8AC;
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.5 var(--text); }
#app { --accent: var(--moon); --r1: var(--moon1); --r2: var(--moon2); --r3: var(--moon3); --r4: var(--moon4); --r5: var(--moon5); }
#app[data-body="Mars"] { --accent: var(--mars); --r1: var(--mars1); --r2: var(--mars2); --r3: var(--mars3); --r4: var(--mars4); --r5: var(--mars5); }
.wrap { max-width: 74rem; margin: 0 auto; padding-block: 1.25rem 3rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: 2.4rem; letter-spacing: -0.01em; }
h2 { font-size: 1.75rem; margin-bottom: .35rem; }
h3 { font-size: 1.2rem; margin: 1.5rem 0 .5rem; }
p { margin: 0 0 .75rem; max-width: 68ch; }
a { color: inherit; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.eyebrow { font-size: .8rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 .15rem; }
header p { margin: .2rem 0 0; color: var(--muted); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.themebtn { flex: none; padding: .35rem .75rem; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; cursor: pointer; font-size: .9rem; }
.campmap { display: block; width: 100%; height: 42rem; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); }
.notice { margin: .9rem 0 0; padding: .55rem .8rem; border-left: 4px solid var(--warn); background: var(--surface); font-size: .9rem; max-width: none; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- controls */
.controls { margin-top: 1.25rem; display: grid; gap: 1rem 2rem; }
@media (min-width: 60rem) { .controls { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); align-items: start; } }
.field > span, .field label > span { display: block; font-weight: 600; margin-bottom: .35rem; }
.targets { display: grid; gap: .4rem; grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr)); }
.targets button { text-align: left; padding: .45rem .65rem; background: var(--surface); border: 1px solid var(--line);
  border-left: 4px solid var(--moon); border-radius: 3px; cursor: pointer; line-height: 1.25; }
.targets button[data-b="Mars"] { border-left-color: var(--mars); }
.targets button small { display: block; color: var(--muted); }
.targets button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.targets button[aria-pressed="true"] small { color: inherit; opacity: .75; }
select { width: 100%; padding: .5rem; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; }
details.weights { margin-top: .5rem; }
details.weights summary { cursor: pointer; color: var(--muted); }
.sliders { display: grid; gap: .3rem; margin-top: .6rem; }
.sliders label { display: grid; grid-template-columns: minmax(0, 1fr) 6.5rem 2rem; align-items: center; gap: .5rem; font-size: .9rem; }
.sliders input { width: 100%; accent-color: var(--accent); }
.sliders output { text-align: right; font-variant-numeric: tabular-nums; }

nav { display: flex; gap: 1.4rem; margin: 1.5rem 0 1.25rem; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav a { padding: .5rem 0; color: var(--muted); text-decoration: none; font-weight: 500; white-space: nowrap; border-bottom: 3px solid transparent; }
nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

/* ---- analogs: heading, facts, maps */
.thead { display: grid; gap: 1rem 2.5rem; margin-bottom: 1rem; }
@media (min-width: 60rem) { .thead { grid-template-columns: minmax(0, 1fr) auto; align-items: end; } }
.thead p { margin-bottom: 0; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .75rem 1.25rem; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font: 600 1.7rem/1 var(--display); }
.facts dd { margin: .2rem 0 0; font-size: .8rem; color: var(--muted); line-height: 1.3; }
@media (min-width: 60rem) { .facts { grid-template-columns: repeat(3, minmax(0, 12.5rem)); gap: .75rem 2.25rem; } .facts dt { font-size: 2rem; } .facts dd { font-size: .875rem; } }
.maps { display: grid; gap: 1rem; }
@media (min-width: 60rem) { .maps { grid-template-columns: minmax(0, 1fr) 12.5rem; align-items: center; } }
.mapbox { min-width: 0; }
.poles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
@media (min-width: 60rem) { .poles { grid-template-columns: minmax(0, 1fr); } }
figure { margin: 0; min-width: 0; }
figcaption { font-size: .8rem; color: var(--muted); text-align: center; margin-top: .1rem; }
.polebox { width: 100%; max-width: 13rem; margin-inline: auto; aspect-ratio: 1; }
svg.mapsvg { display: block; max-width: 100%; height: auto; overflow: visible; }
.mapsvg .ocean { fill: var(--ocean); stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.mapsvg .land { fill: var(--land); }
.mapsvg .grat { fill: none; stroke: var(--grat); stroke-width: 1; vector-effect: non-scaling-stroke; }
.mapsvg .cell { cursor: pointer; }
.c0 { fill: var(--r1); } .c1 { fill: var(--r2); } .c2 { fill: var(--r3); } .c3 { fill: var(--r4); } .c4 { fill: var(--r5); }
.mapsvg .top { fill: var(--r5); stroke: var(--ocean); stroke-width: 2; cursor: pointer; }
.mapsvg .known { fill: none; stroke: var(--ink); stroke-width: 1.5; cursor: pointer; pointer-events: all; }
.mapsvg .selring { fill: none; stroke: var(--ink); stroke-width: 2; }
.mapsvg .sellab { font: 600 12px var(--text); fill: var(--ink); stroke: var(--ocean); stroke-width: 3; paint-order: stroke; pointer-events: none; }
.mapsvg .lonlab { font: 500 10px var(--text); fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1.5rem; margin: .6rem 0 0; font-size: .875rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: .4rem; }
.legend svg { width: 1rem; height: 1rem; flex: none; }
.scale { display: inline-flex; gap: 2px; }
.scale i { width: 1.4rem; height: .7rem; }
.scale i:first-child { border-radius: 2px 0 0 2px; } .scale i:last-child { border-radius: 0 2px 2px 0; }
.scale .c0 { background: var(--r1); } .scale .c1 { background: var(--r2); } .scale .c2 { background: var(--r3); } .scale .c3 { background: var(--r4); } .scale .c4 { background: var(--r5); }
#tip { position: fixed; z-index: 20; pointer-events: none; max-width: 16rem; padding: .4rem .6rem; background: var(--ink); color: var(--bg);
  border-radius: 3px; font-size: .85rem; line-height: 1.35; }
#tip b { display: block; font-weight: 600; }

/* ---- analogs: ranked list beside the comparison panel */
.duo { display: grid; gap: 1.5rem; margin-top: 1.75rem; }
@media (min-width: 60rem) { .duo { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); align-items: start; }
  .duo .panel { grid-column: 2; grid-row: 1 / span 2; } .duo .cannot { grid-column: 1; grid-row: 2; } }
.cannot .prop { grid-template-columns: minmax(0, 1fr) 2.6rem; grid-template-areas: "label sim" "strip strip" "cap cap"; }
.duo > * { min-width: 0; }
ol.rank { list-style: none; padding: 0; margin: 0; }
ol.rank > li { border-top: 1px solid var(--line); }
ol.rank > li:last-child { border-bottom: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; gap: .1rem .5rem; width: 100%; padding: .55rem .4rem;
  background: none; border: 0; text-align: left; cursor: pointer; align-items: baseline; }
.row[aria-pressed="true"] { background: var(--surface); box-shadow: inset 4px 0 0 var(--accent); }
.row .n { font: 600 1.25rem var(--display); color: var(--muted); }
.row .score { font: 600 1.25rem var(--display); font-variant-numeric: tabular-nums; }
.row .name { font-weight: 600; }
.row .sub { display: block; color: var(--muted); font-size: .875rem; }
.row .sbar { grid-column: 2 / 4; height: 4px; background: var(--track); border-radius: 2px; overflow: hidden; margin-top: .25rem; }
.row .sbar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.tag { display: inline-block; font-size: .8rem; padding: 0 .4rem; border: 1px solid currentColor; border-radius: 2px; }
.tag.new { color: var(--accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 1rem 1.1rem 1.2rem; scroll-margin-top: .5rem; }
.vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: .75rem; align-items: center; }
.vs .side strong { display: block; font: 600 1.25rem/1.15 var(--display); }
.vs .side:last-child { text-align: right; }
.vs .mid { text-align: center; padding: 0 .25rem; }
@media (max-width: 34rem) { .vs { grid-template-columns: repeat(2, minmax(0, 1fr)); } .vs .mid { grid-column: 1 / 3; grid-row: 1; } }
.vs .big { display: block; font: 600 2.6rem/1 var(--display); }
.sub { color: var(--muted); font-size: .875rem; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(4rem, 9rem) 2.6rem; gap: .5rem; align-items: center; font-size: .875rem; padding: .12rem 0; }
.bar .track, .inbar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
.bar .track i, .inbar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bar .v { text-align: right; font-variant-numeric: tabular-nums; }
.key { display: flex; flex-wrap: wrap; gap: .25rem 1.1rem; margin: 0 0 .6rem; font-size: .8rem; color: var(--muted); }
.key span { display: inline-flex; align-items: center; gap: .35rem; }
.key i { display: inline-block; flex: none; }
.key .k-tgt { width: 2px; height: 14px; background: var(--ink); }
.key .k-here { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.key .k-earth { width: 18px; height: 6px; border-radius: 3px; background: var(--track); }
.key .k-band { width: 18px; height: 10px; border-radius: 2px; background: color-mix(in srgb, var(--accent) 30%, transparent); }
.key .k-off { width: 0; height: 0; border: 5px solid transparent; border-left-color: var(--bad); margin-right: -5px; }
.dimhead { display: flex; justify-content: space-between; gap: 1rem; margin: 1rem 0 .15rem; padding-bottom: .15rem; border-bottom: 1px solid var(--line);
  font-size: .8rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.prop { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr) 2.6rem; grid-template-areas: "label strip sim" ". cap cap";
  gap: 0 .75rem; align-items: center; padding: .3rem 0; font-size: .9rem; }
@media (max-width: 34rem) { .prop { grid-template-columns: minmax(0, 1fr) 2.6rem; grid-template-areas: "label sim" "strip strip" "cap cap"; } }
.prop .label { grid-area: label; }
.prop .sim { grid-area: sim; text-align: right; font-variant-numeric: tabular-nums; }
.prop .cap { grid-area: cap; font-size: .8rem; color: var(--muted); }
.strip { grid-area: strip; display: block; position: relative; height: 22px; }
.strip::before { content: ""; position: absolute; left: 0; right: 0; top: 10.5px; height: 1px; background: var(--line); }
.strip i { position: absolute; display: block; }
.strip .earth { top: 8px; height: 6px; border-radius: 3px; background: var(--track); }
.strip .band { top: 5px; height: 12px; border-radius: 2px; background: color-mix(in srgb, var(--accent) 30%, transparent); }
.strip .tgt { top: 1px; width: 2px; height: 20px; background: var(--ink); transform: translateX(-1px); }
.strip .tgt.off-lo, .strip .tgt.off-hi { top: 5px; width: 0; height: 0; background: none; border: 6px solid transparent; transform: translateX(-6px); }
.strip .tgt.off-lo { border-right-color: var(--bad); }
.strip .tgt.off-hi { border-left-color: var(--bad); }
.strip .here { top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); transform: translateX(-6px); }

/* ---- status glyphs, matrix, tables */
.g { width: .95rem; height: .95rem; vertical-align: -.15rem; flex: none; }
.g-match { color: var(--ok); } .g-partial { color: var(--warn); } .g-breaks_down { color: var(--bad); } .g-not_tested { color: var(--muted); } .g-input_only { color: var(--muted); } .g-not_comparable { color: var(--muted); }
.glyphs { display: inline-flex; flex-wrap: wrap; gap: 2px; }
/* ---- simple view */
#app.simple nav a.adv, #app.simple details.weights { display: none; }
/* ---- one page, one question */
.pages { display: flex; flex-wrap: wrap; gap: .3rem 1.1rem; margin: .5rem 0 .2rem; font-size: .9rem; max-width: none; }
.pages a { color: var(--muted); text-decoration: none; padding-bottom: .1rem; border-bottom: 2px solid transparent; }
.pages a:hover { color: var(--ink); }
.pages a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
#app.explorer #missionBox, #app.explorer nav { display: none; }
#app.evidence #focusWrap { display: none !important; }
#app.explorer #focusWrap { margin-top: 0 !important; }
details.cantbe { max-width: 46rem; margin: 0 0 1rem; font-size: .9rem; }
details.cantbe summary { cursor: pointer; color: var(--muted); }
details.cantbe ul { margin: .5rem 0 0; padding-left: 1.2rem; }
details.cantbe li { margin: .25rem 0; }
.meter .vals { grid-column: 1 / -1; font-size: .8rem; color: var(--muted); }
.verdict { display: grid; grid-template-columns: auto 1fr; gap: 1rem; align-items: center; padding: .9rem 1rem; margin: .2rem 0 1rem; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--gc, var(--ok)); max-width: 46rem; }
.verdict .big { font-size: 2.3rem; font-weight: 700; line-height: 1; color: var(--gc, var(--ok)); white-space: nowrap; }
.verdict .big small { display: block; font-size: .7rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: .3rem; }
.verdict strong { display: block; font-size: 1.05rem; line-height: 1.3; }
.verdict p { margin: .3rem 0 0; font-size: .9rem; color: var(--muted); max-width: none; }
.g-ex { --gc: var(--ok); } .g-good { --gc: #5E9E3E; } .g-fair { --gc: var(--warn); } .g-none { --gc: var(--muted); } .g-bad { --gc: var(--bad); }
.meters { display: grid; gap: .55rem; max-width: 34rem; margin: .4rem 0 .2rem; }
.meter { display: grid; grid-template-columns: 1fr auto; gap: .1rem .8rem; align-items: baseline; font-size: .9rem; }
.meter .gw { font-weight: 600; color: var(--gc); white-space: nowrap; }
.meter .gw small { font-weight: 400; color: var(--muted); margin-left: .35rem; }
.meter .mtrack { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter .mtrack i { display: block; height: 100%; border-radius: 4px; background: var(--gc); }
.gscale { display: flex; flex-wrap: wrap; gap: .2rem 1rem; font-size: .8rem; color: var(--muted); margin: .5rem 0 0; }
.gscale span::before { content: ""; display: inline-block; width: .6rem; height: .6rem; border-radius: 50%; background: var(--gc); margin-right: .35rem; }
.row .score.words { font-size: .85rem; white-space: nowrap; }
/* ---- stress tests */
.hz { display: grid; grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr)); gap: .9rem; margin-top: 1rem; }
.hz article { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--gc, var(--muted)); border-radius: 10px; padding: .9rem 1rem 1rem; }
.hz h3 { margin: 0 0 .15rem; font-size: 1.1rem; }
.hz .tests { font-size: .85rem; color: var(--muted); margin: 0 0 .6rem; max-width: none; }
.hz .vd { display: inline-block; font-size: .78rem; font-weight: 700; letter-spacing: .03em; color: var(--gc); border: 1px solid var(--gc); border-radius: 999px; padding: .1rem .6rem; margin-bottom: .55rem; }
.hz .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin: 0 0 .6rem; }
.hz .cmp div { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: .45rem .6rem; }
.hz .cmp b { display: block; font-size: 1.15rem; }
.hz .cmp span { display: block; font-size: .75rem; color: var(--muted); }
.hz ol { margin: 0; padding-left: 1.2rem; font-size: .88rem; }
.hz ol li { margin: .15rem 0; }
.hz .why { font-size: .82rem; color: var(--muted); margin: .6rem 0 0; max-width: none; }
.hz .match { font-size: .88rem; margin: 0 0 .6rem; padding: .45rem .6rem; border-left: 3px solid var(--gc); background: var(--bg); border-radius: 0 6px 6px 0; max-width: none; }
.hz .also { font-size: .82rem; color: var(--muted); margin: .5rem 0 0; max-width: none; }
.sgrid td, .sgrid th { text-align: center; padding: .35rem .4rem; }
.sgrid th:first-child, .sgrid td:first-child { text-align: left; white-space: nowrap; }
.sgrid thead th { font-size: .72rem; line-height: 1.15; vertical-align: bottom; max-width: 5.5rem; }
.sgrid thead th small { display: block; font-weight: 400; }
.sgrid td button { width: 1.5rem; height: 1.5rem; border-radius: 50%; border: 0; background: var(--gc); cursor: pointer; opacity: .9; padding: 0; }
.sgrid td button:hover { opacity: 1; outline: 2px solid var(--ink); outline-offset: 1px; }
.sgrid td .na { color: var(--muted); }
.sgrid tr.cur td, .sgrid th.cur { background: var(--surface); }
.sdetail { margin: .8rem 0 0; padding: .7rem .9rem; border: 1px solid var(--line); border-left: 4px solid var(--gc, var(--muted)); border-radius: 8px; background: var(--surface); max-width: 46rem; }
.sdetail strong { display: block; }
.sdetail p { margin: .25rem 0 0; font-size: .9rem; max-width: none; }
.row .score.words b { color: var(--gc); font-weight: 600; margin-left: .3rem; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
.scroll { overflow-x: auto; }
th, td { text-align: left; padding: .4rem .6rem .4rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
thead th { font-size: .8rem; font-weight: 600; color: var(--muted); vertical-align: bottom; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.matrix td, .matrix th { vertical-align: middle; }
.matrix tbody th { font-weight: 400; padding-left: .5rem; }
.matrix tbody th button { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font-weight: 600; line-height: 1.25; }
.matrix tbody th small { display: block; font-weight: 400; color: var(--muted); }
.matrix tr.cur th, .matrix tr.cur td { background: var(--surface); }
.matrix tr.cur th { box-shadow: inset 4px 0 0 var(--accent); }
.matrix .cov { min-width: 8rem; white-space: nowrap; }
.cov .inbar, td .inbar { display: inline-block; width: 5rem; vertical-align: middle; margin-right: .4rem; }
.status { list-style: none; padding: 0; margin: 0; max-width: 54rem; }
.status > li { padding: .5rem 0 .6rem; border-top: 1px solid var(--line); }
.status li strong { display: inline; }
.status .why { display: block; font-size: .875rem; max-width: 68ch; }
.status .prop { padding-bottom: 0; }
details.card { border-top: 1px solid var(--line); }
details.card summary { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .5rem; padding: .6rem 0; cursor: pointer; align-items: baseline; }
details.card summary small { display: block; color: var(--muted); }
.verdict { font-weight: 600; white-space: nowrap; }
.verdict.accepted { color: var(--ok); } .verdict.denied { color: var(--bad); } .verdict.pending { color: var(--warn); }
.seg { display: flex; gap: 2px; height: 12px; margin: .6rem 0 .4rem; max-width: 40rem; }
.seg i { display: block; border-radius: 3px; min-width: 3px; }
.seg .accepted, .sw.accepted { background: var(--ok); } .seg .pending, .sw.pending { background: var(--warn); } .seg .denied, .sw.denied { background: var(--bad); }
.sw { display: inline-block; width: .7rem; height: .7rem; border-radius: 2px; }
.runs { display: grid; gap: .5rem 1.5rem; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); margin: .75rem 0 1rem; }
.runs .inbar { margin-top: .2rem; }
code { font-size: .85em; word-break: break-all; }
.checks { list-style: none; padding: 0 0 .8rem; margin: 0; font-size: .9rem; }
.checks li { display: grid; grid-template-columns: 4.2rem minmax(0, 1fr); gap: .5rem; padding: .2rem 0; }
.checks .pass { color: var(--ok); } .checks .warn { color: var(--warn); } .checks .fail { color: var(--bad); }
.log { font-size: .875rem; color: var(--muted); padding-left: 1.2rem; }
@media (prefers-reduced-motion: no-preference) { .row .sbar i, .bar .track i { transition: width .25s ease; } }

<script>// EarthMimic scoring, mirrored from earthmimic/matching.py and
// earthmimic/sensitivity.py so the dashboard can re-score live when the
// weights change. tests/test_earthmimic.py checks both give the same scores.
var EM = (function () {
  "use strict";

  // Pairings of this target that enter the score (match or partial).
  function usedPairs(target) {
    return target.profile.filter(function (p) { return p.factor > 0; });
  }

  // One Float64Array of similarities per used pairing; NaN where Earth has no value.
  function similarities(earthCols, used) {
    return used.map(function (p) {
      var x = earthCols[p.earth_col], out = new Float64Array(x.length);
      for (var i = 0; i < x.length; i++) {
        if (x[i] === null) { out[i] = NaN; continue; }
        var z;
        if (p.scale === "log") {
          if (!(x[i] > 0)) { out[i] = NaN; continue; }
          z = (Math.log10(x[i]) - Math.log10(p.target_value)) / p.bandwidth;
        } else z = (x[i] - p.target_value) / p.bandwidth;
        out[i] = Math.exp(-0.5 * z * z);
      }
      return out;
    });
  }

  // Normalised weight of each used pairing. `scale` optionally jitters confidences.
  function pairWeights(used, weights, scale) {
    var c = used.map(function (p, i) { return p.confidence * p.factor * (scale ? scale[i] : 1); });
    var sumByDim = {};
    used.forEach(function (p, i) { sumByDim[p.dimension] = (sumByDim[p.dimension] || 0) + c[i]; });
    var u = used.map(function (p, i) {
      var s = sumByDim[p.dimension];
      return s > 0 ? (weights[p.dimension] || 0) * c[i] / s : 0;
    });
    var total = u.reduce(function (a, b) { return a + b; }, 0);
    return total > 0 ? u.map(function (v) { return v / total; }) : u;
  }

  // Weighted mean of similarities per cell, skipping missing values.
  function combine(sims, u, minShare) {
    var n = sims.length ? sims[0].length : 0, out = new Float64Array(n);
    for (var i = 0; i < n; i++) {
      var num = 0, have = 0;
      for (var j = 0; j < sims.length; j++) {
        var s = sims[j][i];
        if (s === s) { num += u[j] * s; have += u[j]; }
      }
      out[i] = have >= minShare && have > 0 ? num / have : NaN;
    }
    return out;
  }

  // Per-dimension score of one cell.
  function dimScores(sims, used, i) {
    var num = {}, den = {};
    used.forEach(function (p, j) {
      var s = sims[j][i], c = p.confidence * p.factor;
      if (s === s) {
        num[p.dimension] = (num[p.dimension] || 0) + c * s;
        den[p.dimension] = (den[p.dimension] || 0) + c;
      }
    });
    var out = {};
    Object.keys(den).forEach(function (d) { if (den[d] > 0) out[d] = num[d] / den[d]; });
    return out;
  }

  // Share of the mission's weight Earth can test at all.
  function coverage(profile, weights) {
    var groups = {};
    profile.forEach(function (p) {
      if (p.status === "not_comparable" || p.status === "input_only") return;
      (groups[p.dimension] = groups[p.dimension] || []).push(p.factor);
    });
    var num = 0, den = 0;
    Object.keys(groups).forEach(function (d) {
      var w = weights[d] || 0, f = groups[d];
      den += w;
      num += w * f.reduce(function (a, b) { return a + b; }, 0) / f.length;
    });
    return den > 0 ? num / den : 0;
  }

  // Indices sorted best first; NaN scores last.
  function ranking(total) {
    var idx = Array.from({ length: total.length }, function (_, i) { return i; });
    var key = function (i) { return total[i] === total[i] ? total[i] : -1; };
    idx.sort(function (a, b) { return key(b) - key(a); });
    return idx;
  }

  // ---- seeded random numbers for the sensitivity analysis
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function normal(rand) {
    var u = 0, v = 0;
    while (u === 0) u = rand();
    while (v === 0) v = rand();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  function gamma(rand, shape) {  // Marsaglia-Tsang
    if (shape < 1) return gamma(rand, shape + 1) * Math.pow(rand() || 1e-12, 1 / shape);
    var d = shape - 1 / 3, c = 1 / Math.sqrt(9 * d);
    for (;;) {
      var x = normal(rand), v = 1 + c * x;
      if (v <= 0) continue;
      v = v * v * v;
      var u = rand() || 1e-12;
      if (Math.log(u) < 0.5 * x * x + d - d * v + d * Math.log(v)) return d * v;
    }
  }

  // Share of perturbed runs in which each cell lands in the top K.
  function stability(sims, used, weights, opts) {
    var rand = rng(opts.seed || 1), n = sims.length ? sims[0].length : 0;
    var hits = new Float64Array(n);
    var dims = Object.keys(weights).filter(function (d) { return weights[d] > 0; });
    var sum = dims.reduce(function (a, d) { return a + weights[d]; }, 0);
    if (!dims.length || !used.length) return hits;
    for (var r = 0; r < opts.n_runs; r++) {
      var w = {}, g = 0;
      dims.forEach(function (d) { w[d] = gamma(rand, opts.concentration * weights[d] / sum); g += w[d]; });
      dims.forEach(function (d) { w[d] /= g; });
      var scale = used.map(function () { return 1 + opts.confidence_jitter * (2 * rand() - 1); });
      var order = ranking(combine(sims, pairWeights(used, w, scale), opts.min_data_share));
      for (var k = 0; k < opts.top_k && k < n; k++) hits[order[k]] += 1;
    }
    for (var i = 0; i < n; i++) hits[i] /= opts.n_runs;
    return hits;
  }

  return { usedPairs: usedPairs, similarities: similarities, pairWeights: pairWeights, combine: combine,
           dimScores: dimScores, coverage: coverage, ranking: ranking, stability: stability };
})();
if (typeof module !== "undefined") module.exports = EM;
</script>

  // ------------------------------------------------- field campaign routing
  var campState = { start: undefined };   // undefined until first drawn: then the pipeline's start point, if any

  function haverKm(la1, lo1, la2, lo2) {
    var r = Math.PI / 180, a = Math.sin((la2 - la1) * r / 2), b = Math.sin((lo2 - lo1) * r / 2);
    return 2 * 6371 * Math.asin(Math.sqrt(a * a + Math.cos(la1 * r) * Math.cos(la2 * r) * b * b));
  }

  // Which sites make up each campaign is decided by the pipeline (coverage, confirmation, match quality) and does
  // not depend on the start point; only the visiting order and the distance do, so that is all that is redone here.
  function campaignCurve(start) {
    var pre = live.t.campaign;
    return ((pre && pre.rows) || []).map(function (r) {
      var idx = r.stops.map(function (x) { return x.index; }), best = idx.slice(), bk = Infinity;
      var km = function (order) {
        var dkm = 0, prev = start;
        order.forEach(function (ix) { if (prev) dkm += haverKm(prev[0], prev[1], D.earth.lat[ix], D.earth.lon[ix]); prev = [D.earth.lat[ix], D.earth.lon[ix]]; });
        return dkm;
      };
      var perm = function (cur, rest) {
        if (!rest.length) { var v = km(cur); if (v < bk) { bk = v; best = cur.slice(); } return; }
        for (var q = 0; q < rest.length; q++) perm(cur.concat([rest[q]]), rest.slice(0, q).concat(rest.slice(q + 1)));
      };
      perm([], idx);
      return { k: r.k, covered: r.covered, confirmed: r.confirmed, mean_score: r.mean_score, km: bk,
               stops: best.map(function (ix) { return { index: ix, lat: D.earth.lat[ix], lon: D.earth.lon[ix] }; }) };
    });
  }

  function sameStart(a, b) { return (!a && !b) || (!!a && !!b && a[0] === b[0] && a[1] === b[1]); }

  function mapUrl() {
    var s = campState.start;
    return "campaign_map.html?target=" + encodeURIComponent(live.t.id) + (s ? "#start=" + s[0] + "," + s[1] : "#free");
  }

  function campaignSection(nReq) {
    var pre = live.t.campaign;
    if (campState.start === undefined) campState.start = (pre && pre.start) || null;
    var h = '<h3>Field campaign: cost against coverage</h3>' +
      '<p class="muted small">Heavy equipment that needs setting up favours fewer sites; portable instruments favour fewer kilometres. ' +
      'Each row is the best campaign for that number of sites, drawn from the best-matching Earth sites: most requirements covered, then most confirmed at a second site, then best overall match. A stop is added only while it covers or confirms something. ' +
      'Pick the row that matches your equipment.</p>' +
      '<div id="camp-section">' + campaignInner(nReq) + "</div>";
    if (D.campaign_map) {
      h += '<h3>On the map</h3><p class="muted small">Click the map to set the start point, or drag the red pin; the table above follows. ' +
        'The cursor\'s latitude and longitude show live; click a campaign card in the map panel to draw it. Map tiles need an internet connection. ' +
        '<a id="camp-map-link" href="' + mapUrl() + '" target="_blank" rel="noopener">Open the map in its own tab</a>.</p>' +
        '<iframe id="camp-map" class="campmap" src="' + mapUrl() + '" title="Campaign routes on a world map"></iframe>';
    }
    return h;
  }

  function campaignInner(nReq) {
    var pre = live.t.campaign, s = campState.start;
    // The pipeline precomputed the curve for its own start point (the report shows the same rows);
    // for any other start point the same stops are re-ordered here in the browser.
    var precomputed = !!(pre && pre.rows && sameStart(s, pre.start));
    var rows = precomputed ? pre.rows : campaignCurve(s);
    var h = '<p>Start from latitude <input id="camp-lat" type="number" step="any" min="-90" max="90" style="width:6em" value="' + (s ? s[0] : "") + '"> ' +
      'longitude <input id="camp-lon" type="number" step="any" min="-180" max="180" style="width:6em" value="' + (s ? s[1] : "") + '"> ' +
      '<button type="button" onclick="EMcampaign()">Plan routes</button>' +
      (s ? ' <button type="button" onclick="EMcampaign(true)">Clear start</button>' : "") +
      ' <span class="muted small">' + (s ? "Routes start at " + ll(s[0], s[1]) + "." : "No start point: the route is free-floating, so its length is the distance between the stops only.") +
      (precomputed ? "" : " Computed in your browser.") + "</span></p>";
    if (!rows.length) return h + "<p>No requirement is testable, so there is nothing to route.</p>";
    h += '<div class="scroll"><table><thead><tr><th>Sites</th><th>Covers</th><th>Confirmed at 2+ sites</th><th>Mean match</th><th class="num">Route km</th><th>Stops in order' + (s ? " (from your start)" : "") + "</th></tr></thead><tbody>";
    rows.forEach(function (r) {
      h += "<tr><td>" + r.k + "</td><td>" + r.covered + " of " + nReq + "</td><td>" + (r.confirmed || 0) + "</td><td>" + (r.mean_score != null ? pct(r.mean_score) : "n/a") +
        '</td><td class="num">' + Math.round(r.km).toLocaleString() + "</td><td>" +
        r.stops.map(function (st) { return esc(cellName(st.index)) + ' <span class="muted">(' + coords(st.index) + ")</span>"; }).join(" → ") + "</td></tr>";
    });
    return h + "</tbody></table></div>";
  }

  document.getElementById("view").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.id && e.target.id.indexOf("camp-") === 0) EMcampaign();
  });
  function redrawCampaign(tellMap) {
    var box = document.getElementById("camp-section");
    if (box) box.innerHTML = campaignInner(live.t.plan.requirements.length);
    var link = document.getElementById("camp-map-link");
    if (link) link.setAttribute("href", mapUrl());
    var frame = document.getElementById("camp-map");
    if (tellMap && frame && frame.contentWindow) frame.contentWindow.postMessage({ type: "earthmimic-set-start", target: live.t.id, start: campState.start }, "*");
  }
  window.EMcampaign = function (clear) {
    var la = parseFloat(document.getElementById("camp-lat").value), lo = parseFloat(document.getElementById("camp-lon").value);
    campState.start = (clear || isNaN(la) || isNaN(lo)) ? null : [Math.max(-90, Math.min(90, la)), Math.round((((lo + 180) % 360 + 360) % 360 - 180) * 100) / 100];
    redrawCampaign(true);
  };
  window.addEventListener("message", function (e) {   // the embedded map reports a start point set by clicking it
    var d = e.data;
    if (!d || d.type !== "earthmimic-start" || !live || d.target !== live.t.id) return;
    campState.start = d.start ? [d.start[0], d.start[1]] : null;
    redrawCampaign(false);
  });

  function viewValidation() {
    var rows = [];
    D.earth.known.forEach(function (name, i) {
      if (!name) return;
      var best = null;
      D.targets.forEach(function (t) {
        if (t.body !== D.earth.known_body[i] && D.earth.known_body[i]) return;
        if (!EM.usedPairs(t).length) return;
        var tot = totals(t), mine = tot[i] === tot[i] ? tot[i] : -1, r = 1;
        for (var k = 0; k < N; k++) if ((tot[k] === tot[k] ? tot[k] : -1) > mine) r++;
        if (!best || r < best.rank) best = { name: name, i: i, target: t, rank: r };
      });
      if (best) rows.push(best);
    });
    var cut = Math.max(1, Math.round(0.05 * N)), hit = rows.filter(function (r) { return r.rank <= cut; }).length;
    var h = "<h2>Does it find the analogs scientists already use?</h2>";
    if (!rows.length) h += "<p>No known analogs were supplied with this dataset.</p>";
    else {
      h += "<p>The engine is never told which sites are known analogs. Under the current weights, <strong>" + hit + " of " + rows.length +
        "</strong> rank in the top 5% of " + N + " Earth cells for at least one target. Ranking at random would put about " + (0.05 * rows.length).toFixed(1) + " there.</p>" +
        '<div class="scroll"><table><thead><tr><th>Known analog</th><th>Best matched target</th><th class="num">Rank</th><th>Share of Earth cells it outranks</th></tr></thead><tbody>' +
        rows.map(function (r) { var share = 1 - (r.rank - 1) / N; return "<tr><td>" + esc(r.name) + '<br><span class="muted small">' + coords(r.i) + "</span></td><td>" + esc(r.target.name) + " (" + esc(r.target.body) +
          ')</td><td class="num">' + r.rank + "</td><td>" + inbar(share) + (100 * share).toFixed(1) + "%</td></tr>"; }).join("") + "</tbody></table></div>";
    }
    var far = live.order.filter(function (i) { return has(i) && isNew(i); }).slice(0, 5);
    h += "<h3>Beyond the known sites</h3><p>Best matches for " + esc(live.t.name) + " that lie more than " + P.min_km + " km from every known analog.</p>" +
      '<div class="scroll"><table><thead><tr><th>Site</th><th class="num">Rank</th><th>Score</th><th>Stays in top ' + P.top_k + "</th></tr></thead><tbody>" +
      far.map(function (i) { return "<tr><td>" + esc(cellName(i)) + '<br><span class="muted small">' + coords(i) + '</span></td><td class="num">' + live.rank[i] +
        "</td><td>" + inbar(live.total[i]) + live.total[i].toFixed(3) + "</td><td>" + inbar(live.stab[i]) + pct(live.stab[i]) + "</td></tr>"; }).join("") + "</tbody></table></div>" +
      "<h3>How stable is the ranking?</h3><p>Weights are a judgment call, so every ranking is recomputed " + P.n_runs +
      " times with the dimension weights reshuffled around your choice and each pairing’s confidence nudged by up to " + pct(P.confidence_jitter) +
      ". A site that stays in the top " + P.top_k + " through nearly all of them does not depend on one exact setting.</p>";
    if (live.top.length && !state.focus) h += '<div class="scroll"><table><thead><tr><th class="num">Rank</th><th>Site</th><th>Stays in top ' + P.top_k + "</th></tr></thead><tbody>" +
      live.top.map(function (i) { return '<tr><td class="num">' + live.rank[i] + "</td><td>" + esc(cellName(i)) + ' <span class="muted small">' + coords(i) + "</span></td><td>" + inbar(live.stab[i]) + pct(live.stab[i]) + "</td></tr>"; }).join("") +
      "</tbody></table></div>";
    return h;
  }

  function viewAgent() {
    var a = D.agent, words = { accepted: "Accepted", denied: "Denied", pending: "Pending" },
      marksW = { pass: "Passed", warn: "Caution", fail: "Failed" };
    var n = function (v) { return a.relationships.filter(function (r) { return r.verdict === v; }).length; };
    var h = "<h2>How the agent paired the datasets</h2><p>The agent proposes which Moon or Mars column corresponds to which Earth column, " +
      "then every proposal must pass fixed checks before it can affect a score. Nothing is approved by hand. Each run may spend " + a.max +
      " tool calls; anything left over stays pending and goes first in the next run. Decisions are stored and reused while the data is unchanged.</p>" +
      '<div class="seg" role="img" aria-label="' + n("accepted") + " accepted, " + n("pending") + " pending, " + n("denied") + ' denied">' +
      ["accepted", "pending", "denied"].map(function (v) { return n(v) ? '<i class="' + v + '" style="flex:' + n(v) + '"></i>' : ""; }).join("") + "</div>" +
      '<p class="key">' + ["accepted", "pending", "denied"].map(function (v) { return '<span><i class="sw ' + v + '"></i>' + n(v) + " " + v + "</span>"; }).join("") + "</p>" + '<div class="runs">' +
      a.runs.map(function (r) { return '<div><span class="small">Run ' + r.run + ": " + r.used + " of " + r.max + " tool calls</span>" + inbar(r.used / r.max).replace('class="inbar"', 'class="inbar" style="display:block"') + "</div>"; }).join("") + "</div>";
    a.relationships.forEach(function (r) {
      var label = words[r.verdict] + (r.verdict === "accepted" ? (r.scored ? " " + r.confidence.toFixed(2) : ", input only") : "");
      h += '<details class="card"><summary><span>' + esc(r.target_label) + (r.earth_label === r.target_label ? "" : " and " + esc(r.earth_label)) + "<small>" + esc(r.target_col) + " with " + esc(r.earth_col || "nothing") +
        (r.conversion ? ", converted " + esc(r.conversion.split(" -> ").map(unitName).join(" to ")) : "") + ", decided in run " + r.decided_in_run +
        '</small></span><span class="verdict ' + r.verdict + '">' + label + "</span></summary>" +
        (r.target_note ? '<p class="small muted">' + esc(r.target_note) + "</p>" : "") + '<ul class="checks">' +
        r.checks.map(function (c) { return '<li><span class="' + c.outcome + '">' + marksW[c.outcome] + "</span><span><strong>" + esc(c.name) + ".</strong> " + esc(c.detail) + "</span></li>"; }).join("") + "</ul></details>";
    });
    a.runs.forEach(function (r) { h += "<h3>Run " + r.run + ' log</h3><ol class="log">' + r.log.map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") + "</ol>"; });
    return h;
  }

  function viewData() {
    var c = D.cleaning, h = "<h2>Where the data came from and what was done to it</h2>";
    if (!c) return h + "<p>This run started from data that was already clean, so there is no cleaning report.</p>";
    h += "<p>Raw tables are cleaned before anything else runs. Nothing is filled in or guessed: bad values become missing values, and every change is counted here.</p>" +
      '<div class="scroll"><table><thead><tr><th>Table</th><th class="num">Rows in</th><th class="num">Rows out</th></tr></thead><tbody>' +
      c.tables.map(function (t) { return "<tr><td>" + esc(t.table) + '</td><td class="num">' + t.rows_in + '</td><td class="num">' + t.rows_out + "</td></tr>"; }).join("") + "</tbody></table></div>" +
      '<h3>What was changed</h3><div class="scroll"><table><thead><tr><th>Problem found</th><th>Where</th><th class="num">Count</th><th>What was done</th></tr></thead><tbody>' +
      c.changes.map(function (x) { return "<tr><td>" + esc(x.rule) + "</td><td>" + esc(x.table) + (x.column ? ", " + esc(x.column) : "") + '</td><td class="num">' + x.count + "</td><td>" + esc(x.action) + "</td></tr>"; }).join("") + "</tbody></table></div>" +
      '<h3>Columns</h3><div class="scroll"><table><thead><tr><th>Column</th><th>Table</th><th>Source</th><th>Missing</th><th class="num">Uncertainty</th></tr></thead><tbody>' +
      c.columns.map(function (x) { return "<tr><td>" + esc(x.label) + '<br><span class="muted small">' + esc(x.column) + "</span></td><td>" + esc(x.table) + "</td><td>" + esc(x.version || x.source) +
        "</td><td>" + inbar(x.missing) + (100 * x.missing).toFixed(1) + '%</td><td class="num">' + (x.uncertainty ? "± " + val(x.uncertainty, x.unit) : "not given") + "</td></tr>"; }).join("") + "</tbody></table></div>" +
      '<h3>Input files</h3><p class="muted small">A fingerprint of each file, so a result can be traced to the exact data behind it.</p><div class="scroll"><table><thead><tr><th>File</th><th class="num">Bytes</th><th>SHA-256 (first 16)</th></tr></thead><tbody>' +
      c.files.map(function (f) { return "<tr><td>" + esc(f.name) + '</td><td class="num">' + f.bytes + "</td><td><code>" + esc(f.sha256.slice(0, 16)) + "</code></td></tr>"; }).join("") + "</tbody></table></div>" +
      '<p class="muted small" style="margin-top:1rem">Map outlines: Natural Earth 1:110m land, public domain.</p>';
    return h;
  }

  function tab() { var h = location.hash.replace("#", ""); return TABS.indexOf(h) >= 0 ? h : TABS[0]; }
  document.getElementById("app").classList.add(PAGE);
  document.getElementById("app").classList.toggle("simple", state.simple);
  document.title = "EarthMimic · " + (PAGE === "explorer" ? "Explorer" : "Evidence");
  document.getElementById("tagline").textContent = PAGE === "explorer"
    ? "Pick a landing site and one property. See where on Earth comes closest."
    : "How we know: the checks behind the results, what Earth cannot do, and the data behind every number.";
  document.querySelectorAll(".pages a[data-page]").forEach(function (a) { if (a.getAttribute("data-page") === PAGE) a.setAttribute("aria-current", "page"); });
  document.querySelector("nav").innerHTML = TABS.map(function (k) { return '<a href="#' + k + '">' + TAB_LABELS[k] + "</a>"; }).join("");
  function draw() {
    var t = tab();
    document.querySelectorAll("nav a").forEach(function (a) { if (a.getAttribute("href") === "#" + t) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    document.getElementById("tip").hidden = true;
    document.getElementById("view").innerHTML = { analogs: viewAnalogs, limits: viewLimits, validation: viewValidation, agent: viewAgent, data: viewData }[t]();
    if (t === "analogs") paintMaps();
  }
  function refresh(resetSelection) { if (resetSelection) state.selected = null; compute(); drawControls(); draw(); }
  function pickTarget(id) { state.target = id; state.focus = null; refresh(true); }

  // -------------------------------------------------------------- events
  document.getElementById("targets").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (b) pickTarget(b.getAttribute("data-t"));
  });
  document.getElementById("preset").addEventListener("change", function (e) {
    if (e.target.value !== "custom") { state.preset = e.target.value; state.weights = Object.assign({}, D.presets[state.preset].weights); refresh(true); }
  });
  document.getElementById("focus").addEventListener("change", function (e) { state.focus = e.target.value || null; state.selected = null; compute(); draw(); });
  document.getElementById("sliders").addEventListener("input", function (e) {
    var d = e.target.getAttribute("data-d"); if (!d) return;
    state.weights[d] = parseFloat(e.target.value); e.target.nextElementSibling.textContent = e.target.value;
  });
  document.getElementById("sliders").addEventListener("change", function () {
    var any = Object.keys(state.weights).some(function (d) { return state.weights[d] > 0; });
    if (!any) state.weights = Object.assign({}, D.presets.balanced.weights);  // all-zero weights score nothing
    state.preset = any ? "custom" : "balanced";
    state.selected = null; compute();
    document.getElementById("preset").value = state.preset;
    document.getElementById("presetAbout").textContent = any ? "Using the weights you set below." : "All weights were zero, so the balanced mission was restored.";
    if (!any) drawControls();
    draw();
  });
  var view = document.getElementById("view"), tip = document.getElementById("tip");
  view.addEventListener("click", function (e) {
    var dot = e.target.closest("[data-hz]");
    if (dot) {
      stressPick = { hz: dot.getAttribute("data-hz"), tg: dot.getAttribute("data-tg") };
      document.getElementById("sdetail").innerHTML = stressDetail(stressPick.hz, stressPick.tg);
      return;
    }
    var tb = e.target.closest("[data-t]");
    if (tb) { pickTarget(tb.getAttribute("data-t")); return; }
    var el = e.target.closest("[data-i]"); if (!el) return;
    state.selected = parseInt(el.getAttribute("data-i"), 10); draw();
    if (el.hasAttribute("data-row") && window.matchMedia("(max-width: 59.99rem)").matches) {
      var calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      document.getElementById("panel").scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "start" });
    }
  });
  function showTip(e) {
    var el = e.target.closest ? e.target.closest(".mapsvg [data-i]") : null;
    if (!el) { tip.hidden = true; return; }
    var i = parseInt(el.getAttribute("data-i"), 10);
    tip.innerHTML = "<b>" + esc(cellName(i)) + "</b>" + coords(i) + "<br>Score " + (has(i) ? live.total[i].toFixed(2) : "n/a") + ", rank " + live.rank[i] + " of " + N +
      (D.earth.known[i] ? "<br>Known analog" : isNew(i) && live.rank[i] <= P.top_k ? "<br>Unrecognized candidate" : "");
    tip.hidden = false;
    var w = tip.offsetWidth, hgt = tip.offsetHeight;
    tip.style.left = Math.max(4, Math.min(window.innerWidth - w - 4, e.clientX + 14)) + "px";
    tip.style.top = (e.clientY + 18 + hgt > window.innerHeight ? e.clientY - hgt - 10 : e.clientY + 18) + "px";
  }
  view.addEventListener("pointermove", showTip);
  view.addEventListener("pointerleave", function () { tip.hidden = true; });
  window.addEventListener("scroll", function () { tip.hidden = true; }, { passive: true });
  var resizeTimer = null;
  window.addEventListener("resize", function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(function () { if (tab() === "analogs") paintMaps(); }, 150); });
  window.addEventListener("hashchange", draw);

  // Light/dark switch. With no choice made, the page follows the device or app theme.
  var root = document.documentElement, themeBtn = document.getElementById("theme");
  function isDark() {
    var t = root.getAttribute("data-theme");
    return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function labelTheme() { themeBtn.textContent = isDark() ? "Light mode" : "Dark mode"; }
  try { var saved = localStorage.getItem("earthmimic-theme"); if (saved === "dark" || saved === "light") root.setAttribute("data-theme", saved); } catch (e) {}
  themeBtn.addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("earthmimic-theme", next); } catch (e) {}
    labelTheme();
  });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", labelTheme);
  labelTheme();
  refresh(true);
})();
</script>
</body>
</html>
